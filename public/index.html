<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentMux</title>
    <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>AgentMux</h1>
      <div class="controls">
        <label>
          工作目录
          <input id="cwd" type="text" placeholder="默认：当前目录" />
        </label>
        <label>
          数量
          <input id="count" type="number" min="1" max="16" value="2" />
        </label>
        <button id="btnLaunch" type="button">启动</button>
        <button id="btnAdd" type="button" disabled>新增终端</button>
        <button id="btnShutdown" type="button" disabled>关闭全部</button>
      </div>
      <p class="hint">
        每个标签对应一个 tmux 会话，启动后自动执行 <code>agent</code>。在下方终端按键即发送到当前会话。
      </p>
    </header>

    <nav id="tabs" class="tabs" aria-label="终端列表"></nav>

    <main class="main">
      <div id="terminalHost"></div>
      <div id="status" class="status" role="status"></div>
    </main>

    <script defer src="/vendor/xterm/lib/xterm.js"></script>
    <script defer src="/vendor/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script defer src="/app.js"></script>
  </body>
</html>
