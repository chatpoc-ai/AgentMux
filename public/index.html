<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentMux</title>
    <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>AgentMux</h1>
      <div class="controls">
        <label>
          工作目录
          <input id="cwd" type="text" placeholder="默认：当前目录" />
        </label>
        <label>
          数量
          <input id="count" type="number" min="1" max="16" value="2" />
        </label>
        <button id="btnLaunch" type="button">启动</button>
        <button id="btnAdd" type="button" disabled>新增终端</button>
        <button id="btnShutdown" type="button" disabled>关闭全部</button>
      </div>
      <p class="hint">
        每个标签对应一个 tmux 会话；启动后会注入环境变量并带
        <code>config/agent-instruction.md</code>
        作为 Cursor agent 的首条指令（上报协议、确认流程）。终端按键即发送到当前会话。
      </p>
    </header>

    <nav id="tabs" class="tabs" aria-label="终端列表"></nav>

    <main class="main">
      <div class="split">
        <div id="terminalHost"></div>
        <aside class="event-panel" aria-label="事件总线">
          <h2 class="event-title">事件总线</h2>
          <div
            id="eventLog"
            class="event-log"
            role="log"
            aria-relevant="additions"
            aria-label="事件总线，最新在上"
          ></div>
          <div class="event-form">
            <label class="ev-row">
              类型
              <input id="evType" type="text" value="ping" />
            </label>
            <label class="ev-row">
              目标终端
              <select id="evTo"></select>
            </label>
            <label class="ev-row ev-text-label">注入文本（可选）</label>
            <textarea
              id="evText"
              rows="3"
              placeholder="填写时向目标 tmux 注入文本；留空则仅 HTTP 广播（可配合「目标终端」转发）"
            ></textarea>
            <label class="ev-check">
              <input type="checkbox" id="evAppendEnter" checked />
              末尾发送 Enter
            </label>
            <button type="button" id="btnEmit">发送事件</button>
          </div>
          <details class="event-hint">
            <summary>终端如何上报事件</summary>
            <p>
              在终端内用 <code>curl</code> 向本服务上报（见下方示例）。事件只经
              HTTP，不再从 tmux 日志解析 stdout 行。
            </p>
            <pre id="curlHint"></pre>
          </details>
        </aside>
      </div>
      <div id="status" class="status" role="status"></div>
    </main>

    <script defer src="/vendor/xterm/lib/xterm.js"></script>
    <script defer src="/vendor/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script defer src="/app.js"></script>
  </body>
</html>
